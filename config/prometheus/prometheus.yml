global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # n8n expone métricas Prometheus si N8N_METRICS=true (activar en .env si se desea)
  - job_name: "n8n"
    metrics_path: /metrics
    static_configs:
      - targets: ["n8n:5678"]

  # Descomentar si se añade postgres_exporter / redis_exporter / node_exporter
  # - job_name: "postgres"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
